---
security:
  - |
    A bug in the ``location_import`` flow used by ``POST
    /v2/images/{image_id}/locations`` was fixed which allowed the
    background secure-hash calculation (``do_secure_hash``, enabled by
    default) to read an unbounded amount of data from the image
    location. A malicious or misbehaving remote location could report a
    small, believable size when the location was validated, but then
    return far more data (or never terminate its response) when the data
    was actually fetched for hashing, keeping a task worker busy
    indefinitely. Hash calculation now honors the existing
    ``image_size_cap`` limit, aborting once more than that many bytes
    have been read, the same protection already applied to other
    image-data ingestion paths (see the ``web-download`` fix in
    `bug 2160020 <https://bugs.launchpad.net/glance/+bug/2160020>`_).
    Note that the default value for this limit is 1TiB, which may be
    higher than is reasonable for some deployments. Operators should
    take this opportunity to review that setting for correctness.
